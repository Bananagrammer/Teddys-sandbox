<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Town Lamps</title>
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #goal, #hud, #prompt {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      color: #eee;
      font-family: monospace;
      text-align: center;
      text-shadow: 1px 1px 3px #000;
      pointer-events: none;
      user-select: none;
    }
    #goal {
      top: 18px;
      font-size: 20px;
      letter-spacing: 0.02em;
    }
    #hud {
      top: 48px;
      color: #ddd;
      font-size: 14px;
      max-width: 92vw;
    }
    #prompt {
      bottom: 36px;
      font-size: 18px;
      color: #ffe7a3;
    }
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>
  <div id="goal">Light the street lamps  0 / 4</div>
  <div id="hud">Click for mouse look &nbsp;|&nbsp; WASD: walk &nbsp;|&nbsp; Mouse: look &nbsp;|&nbsp; E or A: light a lamp</div>
  <div id="prompt"></div>
  <div id="crosshair">+</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
