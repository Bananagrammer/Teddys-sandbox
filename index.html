<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orc's Keep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #ddd;
      font-family: monospace;
      font-size: 14px;
      text-shadow: 1px 1px 3px #000;
      pointer-events: none;
      user-select: none;
    }
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>
  <div id="hud">Click to capture mouse &nbsp;|&nbsp; WASD: Move &nbsp;|&nbsp; Mouse: Look &nbsp;|&nbsp; Space: Jump</div>
  <div id="crosshair">+</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
